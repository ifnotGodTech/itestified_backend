services:
  # Phase 22 groundwork: broker + result backend for the worker service below.
  - type: redis
    name: itestified-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: itestified-backend
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: |
      pip install -r requirements/production.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120
    healthCheckPath: /api/v1/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: itestified-backend.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://itestified-backend.onrender.com
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: true
      - key: DJANGO_USE_X_FORWARDED_HOST
        value: true
      - key: OTP_HINT_IN_RESPONSE
        value: false
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DATABASE_URL
        fromDatabase:
          name: itestified-db
          property: connectionString
      - key: POSTGRES_DB
        fromDatabase:
          name: itestified-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: itestified-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: itestified-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: itestified-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: itestified-db
          property: port
      - key: ADMIN_ENTRY_CODE
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: true
      - key: EMAIL_USE_SSL
        value: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: EMAIL_PROVIDER
        value: smtp
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_IDS
        sync: false
      - key: GOOGLE_OAUTH_ALLOWED_ISSUERS
        value: https://accounts.google.com,accounts.google.com
      - key: FLUTTERWAVE_PUBLIC_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_HASH
        sync: false
      - key: FLUTTERWAVE_BASE_URL
        value: https://api.flutterwave.com
      - key: FLUTTERWAVE_REDIRECT_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: itestified-redis
          property: connectionString
      - key: PUBLIC_SHARE_BASE_URL
        value: https://itestifieddashboard.ifnotgod.com/share
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_BRANDED_EXPORT_FOLDER
        value: itestified/exports
      # Phase 27 Slice 4/5: blank until a real Agora project exists (see
      # config/settings/base.py's own note) -- go-live/end-broadcast fail
      # clearly rather than silently no-opping until these are set.
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false
      - key: AGORA_CUSTOMER_ID
        sync: false
      - key: AGORA_CUSTOMER_SECRET
        sync: false
      - key: AGORA_RECORDING_STORAGE_VENDOR
        sync: false
      - key: AGORA_RECORDING_STORAGE_REGION
        sync: false
      - key: AGORA_RECORDING_STORAGE_BUCKET
        sync: false
      - key: AGORA_RECORDING_STORAGE_ACCESS_KEY
        sync: false
      - key: AGORA_RECORDING_STORAGE_SECRET_KEY
        sync: false
      - key: AGORA_RECORDING_PUBLIC_URL_BASE
        sync: false

  # Phase 22 groundwork: dedicated worker process draining the shared
  # Celery/Redis queue. Separate from the web service so a slow AI API call
  # (Whisper/GPT) never ties up a request-handling gunicorn worker, and
  # separate from the cron services below since those are simple scheduled
  # commands, not a persistent queue consumer.
  - type: worker
    name: itestified-celery-worker
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements/production.txt
    startCommand: celery -A config worker --loglevel=info --concurrency=2
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: itestified-backend.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://itestified-backend.onrender.com
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: true
      - key: DJANGO_USE_X_FORWARDED_HOST
        value: true
      - key: OTP_HINT_IN_RESPONSE
        value: false
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DATABASE_URL
        fromDatabase:
          name: itestified-db
          property: connectionString
      - key: POSTGRES_DB
        fromDatabase:
          name: itestified-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: itestified-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: itestified-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: itestified-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: itestified-db
          property: port
      - key: REDIS_URL
        fromService:
          type: redis
          name: itestified-redis
          property: connectionString
      - key: PUBLIC_SHARE_BASE_URL
        value: https://itestifieddashboard.ifnotgod.com/share
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_BRANDED_EXPORT_FOLDER
        value: itestified/exports
      - key: OPENAI_API_KEY
        sync: false
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false
      - key: AGORA_CUSTOMER_ID
        sync: false
      - key: AGORA_CUSTOMER_SECRET
        sync: false
      - key: AGORA_RECORDING_STORAGE_VENDOR
        sync: false
      - key: AGORA_RECORDING_STORAGE_REGION
        sync: false
      - key: AGORA_RECORDING_STORAGE_BUCKET
        sync: false
      - key: AGORA_RECORDING_STORAGE_ACCESS_KEY
        sync: false
      - key: AGORA_RECORDING_STORAGE_SECRET_KEY
        sync: false
      - key: AGORA_RECORDING_PUBLIC_URL_BASE
        sync: false

  - type: cron
    name: itestified-scheduled-publisher
    runtime: python
    rootDir: backend
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements/production.txt
    startCommand: python manage.py publish_scheduled_testimonies && python manage.py publish_due_scriptures && python manage.py publish_due_inspirational_pictures
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: itestified-backend.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://itestified-backend.onrender.com
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: true
      - key: DJANGO_USE_X_FORWARDED_HOST
        value: true
      - key: OTP_HINT_IN_RESPONSE
        value: false
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DATABASE_URL
        fromDatabase:
          name: itestified-db
          property: connectionString
      - key: POSTGRES_DB
        fromDatabase:
          name: itestified-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: itestified-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: itestified-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: itestified-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: itestified-db
          property: port
      - key: ADMIN_ENTRY_CODE
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: true
      - key: EMAIL_USE_SSL
        value: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: EMAIL_PROVIDER
        value: smtp
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_IDS
        sync: false

  # Phase 27 Slice 5: catches a dropped stream (Agora's SDK notifies
  # connected viewer clients directly, but the backend still needs to mark
  # the LiveBroadcast row ended and kick off archival). Deliberately a
  # cron command, not a new Celery beat scheduler -- matches this file's
  # existing itestified-scheduled-publisher pattern rather than
  # introducing a second periodic-task mechanism. 5-minute cadence matches
  # STALE_BROADCAST_GRACE_SECONDS's own assumption in services/commands.py.
  - type: cron
    name: itestified-live-broadcast-reconciler
    runtime: python
    rootDir: backend
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements/production.txt
    startCommand: python manage.py reconcile_stale_live_broadcasts
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: itestified-backend.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://itestified-backend.onrender.com
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: true
      - key: DJANGO_USE_X_FORWARDED_HOST
        value: true
      - key: OTP_HINT_IN_RESPONSE
        value: false
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DATABASE_URL
        fromDatabase:
          name: itestified-db
          property: connectionString
      - key: POSTGRES_DB
        fromDatabase:
          name: itestified-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: itestified-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: itestified-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: itestified-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: itestified-db
          property: port
      - key: REDIS_URL
        fromService:
          type: redis
          name: itestified-redis
          property: connectionString
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false
      - key: AGORA_CUSTOMER_ID
        sync: false
      - key: AGORA_CUSTOMER_SECRET
        sync: false
      - key: AGORA_RECORDING_STORAGE_VENDOR
        sync: false
      - key: AGORA_RECORDING_STORAGE_REGION
        sync: false
      - key: AGORA_RECORDING_STORAGE_BUCKET
        sync: false
      - key: AGORA_RECORDING_STORAGE_ACCESS_KEY
        sync: false
      - key: AGORA_RECORDING_STORAGE_SECRET_KEY
        sync: false
      - key: AGORA_RECORDING_PUBLIC_URL_BASE
        sync: false

  # Deliberately its own job, not appended to itestified-scheduled-publisher
  # above -- that one runs every 5 minutes, so appending this reminder there
  # would push it up to 288 times a day instead of once. No per-user
  # timezone field exists yet (Phase 17's flagged open gap), so this fires
  # at a single fixed UTC time for every user rather than each user's own
  # evening.
  - type: cron
    name: itestified-scripture-streak-reminder
    runtime: python
    rootDir: backend
    plan: starter
    schedule: "0 19 * * *"
    buildCommand: pip install -r requirements/production.txt
    startCommand: python manage.py send_scripture_streak_reminders
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: itestified-backend.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://itestified-backend.onrender.com
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: true
      - key: DJANGO_USE_X_FORWARDED_HOST
        value: true
      - key: OTP_HINT_IN_RESPONSE
        value: false
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DATABASE_URL
        fromDatabase:
          name: itestified-db
          property: connectionString
      - key: POSTGRES_DB
        fromDatabase:
          name: itestified-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: itestified-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: itestified-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: itestified-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: itestified-db
          property: port
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false

databases:
  - name: itestified-db
    databaseName: itestified
    user: itestified
